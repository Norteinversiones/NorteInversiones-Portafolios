# Pruebas del motor de cálculo: corren en cada push. Si fallan, no hay que publicar.
name: Pruebas

on:
  push:
    paths: ['js/engine.js', 'tests/**', '.github/workflows/pruebas.yml']
  workflow_dispatch:

jobs:
  motor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pruebas del motor
        run: node tests/engine.test.js
