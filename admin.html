<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Panel · Norte Inversiones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=202610072315">
<style>
  .holdings td { padding: 5px 6px; }
  .sumbar { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; padding: 10px 0; }
  .sumbar .big { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .csvbox { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; min-height: 120px; }
  .health td:first-child { font-weight: 500; }
  .verlist li { margin-bottom: 4px; }
  /* encabezados de tabla que ordenan la lista (pestaña Clientes) */
  th .sortth { display: inline-flex; align-items: center; gap: 4px; border: 0; background: transparent; padding: 0; cursor: pointer;
    font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; text-align: inherit; }
  th .sortth:hover, th .sortth.on { color: var(--negro); }
  th .sortth .ar { font-size: 9px; line-height: 1; }
  /* referidos (pestaña Clientes) */
  .selauto { width: auto; min-width: 170px; }
  label.f > span.acwrap { display: block; position: relative; margin: 0; font-weight: 400; }
  .aclist { display: none; position: absolute; z-index: 20; left: 0; right: 0; top: 100%; margin-top: 2px; max-height: 220px; overflow: auto;
    background: var(--blanco); border: 1px solid var(--gris-3); border-radius: 8px; box-shadow: var(--sombra); }
  .aclist.on { display: block; }
  .aclist button { display: block; width: 100%; text-align: left; border: 0; background: transparent; font: inherit; padding: 7px 10px; cursor: pointer; }
  .aclist button:hover, .aclist button.sel { background: var(--amarillo-claro); }
  .linkref { border: 0; background: transparent; padding: 0; font: inherit; color: var(--negro); cursor: pointer;
    text-decoration: underline; text-decoration-color: var(--amarillo); text-decoration-thickness: 2px; }
  .refrow.on { background: var(--amarillo-claro); }
</style>
</head>
<body>

<div class="topbar">
  <div class="inner">
    <a class="brand" href="./">
      <div class="logo" id="brandLogo"><img src="assets/logo-square.png" alt="Norte Inversiones"></div>
      <div><div class="name">Norte <b>Inversiones</b></div><div class="sub">Panel de portafolios</div></div>
    </a>
    <div class="user" id="userBox"></div>
  </div>
</div>

<div class="wrap">

  <!-- LOGIN -->
  <div id="login" class="login card hidden">
    <div class="logo-big"><img src="assets/logo-original.png" alt="Norte Inversiones"></div>
    <h1>Panel de administración</h1>
    <p class="muted">Acceso exclusivo para Norte Inversiones con cuenta de Google.</p>
    <button class="btn google lg mt" id="btnLogin">Entrar con Google</button>
    <p class="legal mt" id="loginMsg"></p>
  </div>

  <!-- APP -->
  <div id="app" class="hidden">
    <div class="tabs" id="tabs">
      <button data-tab="rotacion" class="on">Rotación</button>
      <button data-tab="historico">Histórico</button>
      <button data-tab="catalogo">Catálogo</button>
      <button data-tab="clientes">Clientes</button>
      <button data-tab="comitentes" class="hidden">Comitentes</button>
      <button data-tab="fichas" class="hidden">Fichas</button>
      <button data-tab="ingesta">Ingesta</button>
    </div>

    <section id="tab-rotacion"></section>
    <section id="tab-historico" class="hidden"></section>
    <section id="tab-catalogo" class="hidden"></section>
    <section id="tab-clientes" class="hidden"></section>
    <section id="tab-comitentes" class="hidden"></section>
    <section id="tab-fichas" class="hidden"></section>
    <section id="tab-ingesta" class="hidden"></section>
  </div>

  <p id="loading" class="center muted mt">Cargando…</p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js?v=202610072315"></script>
<script src="js/seed.js?v=202610072315"></script>
<script src="js/engine.js?v=202610072315"></script>
<script src="js/db.js?v=202610072315"></script>
<script src="js/recompute.js?v=202610072315"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="js/clientes.js?v=202610072315"></script>
<script src="js/admin-clientes.js?v=202610072315"></script>
<script src="js/admin.js?v=202610072315"></script>
</body>
</html>
