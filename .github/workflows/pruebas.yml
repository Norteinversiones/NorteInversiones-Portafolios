# Pruebas del motor de cálculo: corren en cada push. Si fallan, no hay que publicar.
name: Pruebas

on:
  push:
    paths: ['js/**', 'ingest/**', 'tests/**', '.github/workflows/pruebas.yml']
  workflow_dispatch:

jobs:
  motor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sintaxis de todos los scripts
        run: for f in js/*.js ingest/*.js tests/*.js; do node --check "$f" || exit 1; done
      - name: Pruebas del motor
        run: node tests/engine.test.js
