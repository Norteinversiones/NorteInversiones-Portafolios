# Captura de precios · corre en los servidores de GitHub, no en tu PC.
# Horarios en UTC (Argentina = UTC-3, sin cambio de hora).
name: Precios

on:
  schedule:
    # Intradía: cada 10 min durante la rueda de BYMA (10:30 a 18:00 ART), lunes a viernes.
    # Si cambia el horario del mercado alcanza con ajustar estas tres líneas: todo horario que no sea
    # de cierre ni de cinta corre como intradía (ver MODE más abajo).
    - cron: '30-59/10 13 * * 1-5'  # 10:30, 10:40, 10:50 ART
    - cron: '*/10 14-20 * * 1-5'   # 11:00 a 17:50 ART
    - cron: '0,10 21 * * 1-5'      # 18:00 y 18:10 ART (toma los precios de cierre)
    - cron: '15 22 * * 1-5'        # cierre: 19:15 ART (data912 tiene ~2 h de delay)
    - cron: '45 23 * * 1-5'        # cierre, segunda pasada: 20:45 ART (pisa la primera si cambió algo)
    - cron: '*/30 13-21 * * 1-5'   # cinta de cotizaciones: cada 30 min, 10:00-18:30 ART (cubre NY y BYMA)
    - cron: '0 23 * * 1-5'         # cinta: cierres del día, 20:00 ART
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo'
        type: choice
        options: [eod, live, market]
        default: eod
      force:
        description: 'Forzar (ignora fin de semana / detección de feriado)'
        type: boolean
        default: false

concurrency:
  group: precios-${{ github.event_name == 'workflow_dispatch' && inputs.mode || ((github.event.schedule == '15 22 * * 1-5' || github.event.schedule == '45 23 * * 1-5') && 'eod' || (github.event.schedule == '*/30 13-21 * * 1-5' || github.event.schedule == '0 23 * * 1-5') && 'market' || 'live') }}
  cancel-in-progress: false

jobs:
  capturar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        working-directory: ingest
        run: npm install --omit=dev --no-audit --no-fund

      - name: Capturar precios
        working-directory: ingest
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || ((github.event.schedule == '15 22 * * 1-5' || github.event.schedule == '45 23 * * 1-5') && 'eod' || (github.event.schedule == '*/30 13-21 * * 1-5' || github.event.schedule == '0 23 * * 1-5') && 'market' || 'live') }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force == true && '--force' || '' }}
        run: node capture.js "$MODE" $FORCE
